services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
# Monitores: importar stacks/uptimekuma/monitors.json desde la UI
# (Settings -> Backup -> Import) o insertarlos con scripts/42-uptimekuma-monitors.sh
