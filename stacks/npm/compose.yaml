services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP (validación / redirección)
      - "443:443"   # HTTPS
      - "81:81"     # Panel de administración
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
# Tras el primer arranque, configurar admin + certificado wildcard + proxy hosts
# con scripts/30-npm-setup.sh (vía API).
