services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${OO_JWT}
      JWT_HEADER: Authorization
    extra_hosts:
      # Para que OnlyOffice pueda llamar a Nextcloud por su dominio vía NPM (TLS válido)
      - "nextcloud.${BASE_DOMAIN}:192.168.2.100"
      - "office.${BASE_DOMAIN}:192.168.2.100"
    volumes:
      - ./data:/var/www/onlyoffice/Data
      - ./log:/var/log/onlyoffice
    ports:
      - "8082:80"
# Integración en Nextcloud (occ): app:install onlyoffice + DocumentServerUrl + jwt_secret.
# Ver scripts/33-nextcloud-onlyoffice.sh
